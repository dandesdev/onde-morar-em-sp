name: Atualizar dados

# Every Monday 09:00 UTC (06:00 in São Paulo), or by hand from the Actions tab.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      OMSP_WORK: ${{ github.workspace }}/work
      OMSP_OUT: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Inputs of the last successful run: if a source is down today, its previous data is reused.
      - name: Restore last good inputs
        uses: actions/cache/restore@v4
        with:
          path: |
            work/raw
            work/processed
            work/sources.json
          key: omsp-work-${{ github.run_id }}
          restore-keys: omsp-work-

      - name: Download, rebuild and check
        run: python -P pipeline/update.py

      - name: Save inputs for next week
        uses: actions/cache/save@v4
        with:
          path: |
            work/raw
            work/processed
            work/sources.json
          key: omsp-work-${{ github.run_id }}

      - name: Assemble site
        run: python -P pipeline/assemble.py _site --data data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      # A small commit per update: an audit trail, and it keeps GitHub from pausing the schedule.
      - name: Record update
        run: |
          cp data/meta.json pipeline/last_update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/last_update.json
          git diff --cached --quiet && exit 0
          git commit -m "Dados atualizados em $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
